<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Route du Samouraï</title>
<style>
:root { --bg:#eef0f2; --panel:#fff; --line:#c5ccd1; --fg:#171c21; --muted:#56616a; --gold:#7d5e0c; --err:#a3350f; color-scheme: light; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#0d1013; --panel:#161b20; --line:#2b343c; --fg:#e9e6da; --muted:#9aa5ab; --gold:#d6ad4c; --err:#f08a66; color-scheme: dark; } }
:root[data-theme="dark"] { --bg:#0d1013; --panel:#161b20; --line:#2b343c; --fg:#e9e6da; --muted:#9aa5ab; --gold:#d6ad4c; --err:#f08a66; color-scheme: dark; }
* { box-sizing: border-box; }
body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif; min-height:100vh; display:grid; place-items:center; padding:24px 16px; }
form { width:100%; max-width:360px; background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:22px; display:flex; flex-direction:column; gap:12px; }
h1 { margin:0; font:700 1.5rem Georgia,"Times New Roman",serif; }
p { margin:0; color:var(--muted); font-size:.92rem; }
input[type=password] { width:100%; padding:11px 12px; border-radius:6px; border:1px solid var(--line); background:var(--bg); color:var(--fg); font:inherit; }
label { font-size:.9rem; }
.r { display:flex; gap:8px; align-items:center; color:var(--muted); }
button { padding:11px; border-radius:6px; border:0; background:var(--gold); color:var(--bg); font:600 1rem inherit; cursor:pointer; }
button:disabled { opacity:.6; cursor:wait; }
#err { color:var(--err); min-height:1.3em; }
:focus-visible { outline:2px solid var(--gold); outline-offset:2px; }
</style>
</head>
<body>
<form id="f">
  <h1>Route du Samouraï</h1>
  <p>Accès protégé par mot de passe.</p>
  <label for="pw">Mot de passe</label>
  <input id="pw" type="password" autocomplete="current-password" autofocus required>
  <label class="r"><input type="checkbox" id="rm" checked> Rester connecté sur cet appareil</label>
  <button id="go" type="submit">Ouvrir</button>
  <p id="err" role="alert"></p>
</form>

var KEY = "er-gate-key";
function d64(s) { var b = atob(s), a = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) a[i] = b.charCodeAt(i); return a; }
function e64(buf) { var a = new Uint8Array(buf), s = ""; for (var i = 0; i < a.length; i++) s += String.fromCharCode(a[i]); return btoa(s); }
function open(text) { document.open(); document.write(text); document.close(); }

<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gamoria — ta collection de jeux rétro</title>
  <meta name="description" content="Gamoria : gère et estime ta collection de jeux vidéo rétro. Scan de code-barres, cote du marché, wishlist et suivi de prix.">
  <style>
    :root {
      --bg: #0f1020; --card: #1a1b30; --fg: #e8e8f0;
      --muted: #a7a8c0; --accent: #8b7cff; --border: #2a2c4a;
    }
    @media (prefers-color-scheme: light) {
      :root { --bg:#f5f5fa; --card:#ffffff; --fg:#1a1b30; --muted:#5a5c78; --accent:#6b5cff; --border:#e2e2ee; }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; background: var(--bg); color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex; align-items: center; justify-content: center; padding: 24px;
    }
    .card {
      background: var(--card); border: 1px solid var(--border); border-radius: 20px;
      max-width: 560px; width: 100%; padding: 40px 32px; text-align: center;
      box-shadow: 0 12px 40px rgba(0,0,0,.25);
    }
    .logo {
      width: 72px; height: 72px; border-radius: 18px; margin: 0 auto 20px;
      background: linear-gradient(135deg, var(--accent), #ff7cc3);
      display: flex; align-items: center; justify-content: center;
      font-size: 38px; font-weight: 800; color: #fff;
    }
    h1 { margin: 0 0 8px; font-size: 28px; }
    p.tag { color: var(--muted); margin: 0 0 28px; font-size: 17px; }
    .links { display: flex; flex-direction: column; gap: 12px; }
    a.btn {
      display: block; padding: 14px 20px; border-radius: 12px; text-decoration: none;
      font-weight: 600; border: 1px solid var(--border); color: var(--fg);
      transition: transform .1s ease;
    }
    a.btn.primary { background: var(--accent); color: #fff; border-color: transparent; }
    a.btn:hover { transform: translateY(-1px); }
    footer { margin-top: 28px; color: var(--muted); font-size: 13px; }
  </style>
</head>
<body>
  <main class="card">
    <div class="logo">G</div>
    <h1>Gamoria</h1>
    <p class="tag">Ta collection de jeux vidéo rétro, estimée et organisée.</p>
    <div class="links">
      <a class="btn primary" href="https://apps.apple.com/app/id6782108447">Télécharger sur l'App Store</a>
      <a class="btn" href="./gamoria-legal/">Politique de confidentialité &amp; mentions légales</a>
    </div>
    <footer>© 2026 DamDes Studio</footer>
  </main>
</body>
</html>
